[project]
name = "backend"
version = "0.1.0"
description = "euroone python backend Istvan Toth"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiosqlite>=0.22.1",
    "fastapi[standard]>=0.142.4",
    "google-genai>=2.29.0",
    "sqlalchemy[asyncio]>=2.1.4",
]
[tool.fastapi]
entrypoint = "app.app:app"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "mypy>=2.4.0",
    "pdoc>=16.0.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.mypy]
plugins = ["pydantic.mypy"]
